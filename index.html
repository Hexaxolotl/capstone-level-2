<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Pokédex</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
		<link rel="stylesheet" href="css/hero.css">
		<link rel="stylesheet" href="css/card.css">
		<link rel="stylesheet" href="css/style.css">
		<link rel="stylesheet" href="./css/rotom.css">
	</head>
	<body>
		<main>
			<nav>
				<ul>
					
				</ul>
			</nav>
			<img id="cursorMon" src="images/marshadow.png" alt="Follower Pokémon">
			<!-- This is the fake homescreen-->
			<div id="homeScreen">
				<h2>Welcome Trainer!</h2>
				<!--This shows my fake apps and pokedex. 
				I want to add more to this part. -->
				<div class="app-grid">
					<div class="app-icon" id="pokedexApp">Pokédex</div>
					<div class="app-icon">Map</div>
					<div class="app-icon">Trainer Card</div>
					<div class="app-icon">Settings</div>
				</div>
			</div>
			
			<div id="rotomPhone">
				
				<div id="rotomHeader">Gen Pokédex</div>
				<!--this is my search bar but I might remove it-->
				<section id="search">
					<input id="search-box" type="text" placeholder="Search Pokémon">
					<button id="searchBtn" type="button">Search</button>
				</section>
				
				<div class="tab">Pokémon Data</div>
				<!--this is my pokemon card conainter-->
				<section id="results">
					<img id="pokeImg" alt="Pokémon image">
					<div id="pokeCard">
						<div class="poke-header"></div> <!-- Name, ID, Type, Ability -->
						<div class="poke-stats"></div> <!-- HP, Attack, Defense, etc -->
						<div class="poke-details"></div> <!-- Height, Weight, Capture Rate, etc -->
					</div>
					
					
					<button id="backBtn">Back</button>
					<button id="nextBtn">Next</button>
					<button id="saveBtn">Save to team</button>
					<button id="returnBtn">Return to home screen</button>
				</section>
				
				<div class="tab">Your Team</div>
				
				<div id="teamDisplay"></div>
				
			</div>
			
			
			
			<section id="about">
				<h2>About the data</h2>
				<p>information on all 802 Pokemon from only Seven Generations of Pokemon, from a table in Code.org's Data Library.</p>
			</section>
			
		</main>
		<footer>
		</footer>
		<script defer src="script.js"></script>
	</body>
</html>
